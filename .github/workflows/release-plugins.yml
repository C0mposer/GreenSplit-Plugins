name: Release plugin

on:
  push:
    tags:
      - "resets-today-v*"
      - "runs-since-pb-v*"
      - "number-of-paces-v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Build installable archive
        run: python tools/package_plugins.py --tag "$GITHUB_REF_NAME"

      - name: Remove old example releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete grind-stats-v1.0.0 --cleanup-tag --yes || true
          gh release delete test-plugins-v0.1.0 --cleanup-tag --yes || true

      - name: Select release information
        run: |
          case "$GITHUB_REF_NAME" in
            resets-today-v*)
              echo "PLUGIN_NAME=Resets Today" >> "$GITHUB_ENV"
              echo "PLUGIN_SLUG=resets-today" >> "$GITHUB_ENV"
              ;;
            runs-since-pb-v*)
              echo "PLUGIN_NAME=Runs Since PB" >> "$GITHUB_ENV"
              echo "PLUGIN_SLUG=runs-since-pb" >> "$GITHUB_ENV"
              ;;
            number-of-paces-v*)
              echo "PLUGIN_NAME=Number of Paces" >> "$GITHUB_ENV"
              echo "PLUGIN_SLUG=number-of-paces" >> "$GITHUB_ENV"
              ;;
            *)
              exit 1
              ;;
          esac

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME"
          "dist/greensplit-$PLUGIN_SLUG-"*.zip
          --verify-tag
          --title "$PLUGIN_NAME ${GITHUB_REF_NAME#*-v}"
          --notes-file "plugins/$PLUGIN_SLUG/CHANGELOG.md"
