name: Update plugin download counts

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: write

concurrency:
  group: update-plugin-download-counts
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out registry
        uses: actions/checkout@v7

      - name: Refresh GitHub release statistics
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 tools/update_download_counts.py

      - name: Commit changed statistics
        run: |
          if git diff --quiet -- plugins.json; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add plugins.json
          git commit -m "Update plugin download counts"
          git push
